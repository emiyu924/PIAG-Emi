<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A2D66">
  <title>Almoxarifado · Clínica Odontológica</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <rect x="5" y="9" width="22" height="17" rx="3" stroke="#0A2D66" stroke-width="2"/>
            <path d="M5 15h22" stroke="#0A2D66" stroke-width="2"/>
            <path d="M12 9V7.2a4 4 0 0 1 8 0V9" stroke="#0A2D66" stroke-width="2"/>
          </svg>
        </div>
        <div>
          <strong id="nome-clinica">Clínica Odontológica</strong>
          <span>Almoxarifado</span>
        </div>
      </div>

      <nav class="menu" aria-label="Seções">
        <button type="button" data-nav="painel" class="ativo" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          Painel
        </button>
        <button type="button" data-nav="estoque">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8z"/><path d="M4 8l2-4h12l2 4"/><path d="M10 12h4"/></svg>
          Estoque
        </button>
        <button type="button" data-nav="movimentos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h12"/><path d="M13 4l3 3-3 3"/><path d="M20 17H8"/><path d="M11 14l-3 3 3 3"/></svg>
          Movimentações
        </button>
      </nav>

      <div class="side-foot">
        <label for="operador">Operador desta sessão</label>
        <input id="operador" maxlength="80" placeholder="Seu nome" autocomplete="name">
        <p>Entradas e saídas ficam registradas com este nome.</p>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="eyebrow">Visão geral</p>
          <h1 id="titulo">Painel do almoxarifado</h1>
        </div>
        <div id="top-actions"></div>
      </header>

      <section id="filtros-estoque" class="filtros" hidden>
        <div class="filtros-linha">
          <label class="campo busca">
            <span class="sr">Buscar material</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
            <input id="busca" type="search" placeholder="Buscar nome, fornecedor ou localização" maxlength="80">
          </label>
          <label class="campo ordem">
            <span>Ordenar</span>
            <select id="ordem">
              <option value="nome">Nome</option>
              <option value="prioridade">Prioridade de reposição</option>
              <option value="maior">Maior quantidade</option>
              <option value="local">Localização</option>
            </select>
          </label>
        </div>
        <div id="chips" class="chips" role="group" aria-label="Categorias"></div>
        <div class="status-filtros" role="group" aria-label="Situação do estoque">
          <button type="button" class="pill ativo" data-status="todos">Todos</button>
          <button type="button" class="pill" data-status="adequado">Adequado</button>
          <button type="button" class="pill" data-status="repor">Reposição</button>
          <button type="button" class="pill" data-status="critico">Crítico</button>
          <button type="button" class="pill" data-status="esgotado">Esgotado</button>
        </div>
      </section>

      <section id="filtros-mov" class="filtros" hidden>
        <div class="filtros-linha">
          <label class="campo busca">
            <span class="sr">Buscar movimentação</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
            <input id="busca-mov" type="search" placeholder="Buscar material, motivo ou operador" maxlength="80">
          </label>
          <label class="campo ordem">
            <span>Tipo</span>
            <select id="tipo-mov">
              <option value="todos">Todos</option>
              <option value="entrada">Entradas</option>
              <option value="saida">Saídas</option>
            </select>
          </label>
        </div>
      </section>

      <main id="conteudo"></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/js/app.js"></script>
</body>
</html>
